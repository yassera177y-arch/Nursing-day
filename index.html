<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة يوم التمريض</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .input-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h2 { color: #1976d2; margin-bottom: 10px; }
        input { width: 85%; padding: 12px; margin: 20px 0; border: 2px solid #bbdefb; border-radius: 10px; font-size: 16px; outline: none; text-align: center; }
        button { background-color: #1976d2; color: white; border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #0d47a1; }
        
        /* حاوية الصورة */
        #card-container { display: none; position: relative; width: 100%; max-width: 500px; margin: 20px; }
        .congrats-image { width: 100%; display: block; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        /* مكان الاسم فوق الصورة */
        #display-name {
            position: absolute;
            top: 38.5%; /* المكان الرمادي في الصورة */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #004d40; /* لون مناسب للتمريض */
            z-index: 10;
        }
        .footer-msg { margin-top: 20px; font-weight: bold; color: #1976d2; font-size: 18px; }
    </style>
</head>
<body>

    <!-- الواجهة الأولى -->
    <div id="input-screen" class="input-container">
        <h2>ممرض المستقبل 🩺</h2>
        <p>بمناسبة يوم التمريض العالمي، أدخل اسمك لتجهيز بطاقتك:</p>
        <input type="text" id="nameInput" placeholder="اكتب اسمك هنا...">
        <br>
        <button onclick="generateCard()">إصدار البطاقة</button>
    </div>

    <!-- الواجهة الثانية (البطاقة) -->
    <div id="card-container">
        <img src="bg.png" class="congrats-image" alt="تهنئة التمريض">
        <div id="display-name"></div>
        <div class="footer-msg">"ممرضينا.. مستقبلنا" 💙</div>
        <button onclick="location.reload()" style="background-color: #90caf9; margin-top: 15px; width: 100%;">إنشاء بطاقة أخرى</button>
    </div>

    <script>
        function generateCard() {
            const name = document.getElementById('nameInput').value;
            if(name.trim() !== "") {
                document.getElementById('input-screen').style.display = 'none';
                document.getElementById('card-container').style.display = 'block';
                document.getElementById('display-name').innerText = name;
            } else {
                alert("لطفاً، اكتب اسمك أولاً");
            }
        }
    </script>

</body>
</html>
